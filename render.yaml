# One-click deploy blueprint for Render.com (Blueprint > New from repo). Free plan = TEST ONLY:
# the free plan sleeps when idle and its disk is erased on restart, so hours/bookings reset.
# For real use, change plan to "starter", uncomment the disk block and add env var DATA_DIR=/var/data (about US$7/month).
services:
  - type: web
    name: seaway-valley
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server.js
    healthCheckPath: /api/slots
    envVars:
      - key: FAX_PROVIDER
        value: dryrun            # change to documo or phaxio once a fax account exists
      - key: ADMIN_PASSWORD
        sync: false              # you type it in on Render's screen; it is never stored in the code
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
